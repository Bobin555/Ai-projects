layout: cfr_section
looks_for: [Requirement]
instructions: |
  Extract each paragraph that states what an application must contain or show as a Requirement.
  Use the paragraph citation exactly as printed as the code, for example 10 CFR 50.34(a)(1).
  The text field holds the requirement in the regulation's own words.
example: |
  For a paragraph headed with its citation, create one Requirement whose code is that citation and whose quote is
  the sentence that states the requirement, copied exactly from the passage.
