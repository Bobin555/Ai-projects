<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HSE Site Induction</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loading" class="overlay"><div><div id="loading-text">Loading site…</div><div class="bar"><div id="loading-bar"></div></div></div></div>
    <div id="error" class="overlay" hidden><div><p id="error-text"></p><button id="error-retry" hidden>Retry</button></div></div>
    <div id="card" hidden><h2 id="card-title"></h2><ul id="card-points"></ul><p class="hint">Press E to close</p></div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
